[project]
name = "clinanon"
version = "0.1.0"
description = "ICD-aware anonymization of patient-doctor encounters (Bosch @ Neural Wave 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "presidio-analyzer>=2.2.360",
    "spacy>=3.8,<3.9",
    # spaCy models are not on PyPI: pin the wheel so a plain `pip install` works offline afterwards.
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "pyyaml>=6.0",
    # The distilled student (src/clinanon/detectors/student.py) runs on CPU with these.
    "torch>=2.5",
    "transformers>=4.51",
]

[project.scripts]
clinanon = "clinanon.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Evaluation only (never needed to anonymize): stand-in privacy judges, and the local LLM that wrote
# the synthetic test passages (scripts/make_synthetic.py).
#   uv sync --group judges --group llm
judges = ["gliner>=0.2.29", "transformers>=4.51", "torch>=2.5"]
llm = ["mlx-lm>=0.32.2"]
# Synthetic test data (scripts/make_synthetic.py): fake names, addresses and phone numbers per locale.
synth = ["faker>=30"]
# Fine-tuning the student (scripts/train_student.py, run on the GPU box).
distill = ["accelerate>=1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/clinanon"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long regexes read better on one line
